<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1815" />
      <stop offset="50%" stop-color="#2d221c" />
      <stop offset="100%" stop-color="#140f0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c2a21" />
      <stop offset="100%" stop-color="#1a120c" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" rx="16" fill="url(#bgGrad)"/>

  <!-- Top App Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#181310" opacity="0.9"/>
  <circle cx="36" cy="32" r="6" fill="#ef4444"/>
  <circle cx="56" cy="32" r="6" fill="#f59e0b"/>
  <circle cx="76" cy="32" r="6" fill="#10b981"/>

  <!-- Logo & Title -->
  <g transform="translate(120, 20)">
    <!-- Coffee Cup Icon -->
    <path d="M4 6h16v10a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6V6zm16 3h3a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-3V9z" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="32" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">LIVESTREAM COFFEE</text>
    <rect x="200" y="4" width="56" height="18" rx="9" fill="#ef4444"/>
    <circle cx="210" cy="13" r="3" fill="#ffffff"/>
    <text x="218" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">LIVE</text>
  </g>

  <!-- Viewer Count & Actions -->
  <text x="960" y="37" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">👁️ 1,428 watching</text>
  <rect x="1080" y="18" width="88" height="30" rx="6" fill="url(#accentGrad)"/>
  <text x="1102" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Order Now</text>

  <!-- Main Grid Layout -->
  <!-- Left: Main Livestream Video Area -->
  <g transform="translate(40, 88)" filter="url(#cardShadow)">
    <rect width="760" height="440" rx="12" fill="url(#streamGrad)" stroke="#44332a" stroke-width="1.5"/>

    <!-- Video Placeholder Content: Roasting in progress -->
    <circle cx="380" cy="200" r="110" fill="#261b15" stroke="#d97706" stroke-dasharray="8 6" stroke-width="2"/>
    <circle cx="380" cy="200" r="75" fill="#451a03" opacity="0.7"/>

    <!-- Coffee Bean Graphic Center -->
    <path d="M380 145 C350 145, 330 170, 330 200 C330 230, 350 255, 380 255 C410 255, 430 230, 430 200 C430 170, 410 145, 380 145 Z" fill="#78350f"/>
    <path d="M380 148 Q395 200 380 252" stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round"/>

    <text x="380" y="335" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Batch #48: Ethiopian Yirgacheffe</text>
    <text x="380" y="362" text-anchor="middle" fill="#d6d3d1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Roast Stage: First Crack reached • Temp: 204°C</text>

    <!-- Overlay Telemetry Stats inside video -->
    <rect x="20" y="20" width="160" height="64" rx="8" fill="#140f0c" opacity="0.85"/>
    <text x="32" y="42" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ROASTER TEMPERATURE</text>
    <text x="32" y="68" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">204.8 °C</text>

    <rect x="190" y="20" width="140" height="64" rx="8" fill="#140f0c" opacity="0.85"/>
    <text x="202" y="42" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">AIRFLOW / DRUM</text>
    <text x="202" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">72 RPM</text>

    <!-- Progress / Roast Curve Bar -->
    <rect x="20" y="405" width="720" height="12" rx="6" fill="#2d221c"/>
    <rect x="20" y="405" width="480" height="12" rx="6" fill="url(#accentGrad)"/>
    <circle cx="500" cy="411" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Right: Interactive Stream Chat & Bean Dropping Queue -->
  <g transform="translate(824, 88)" filter="url(#cardShadow)">
    <rect width="336" height="440" rx="12" fill="#1c1613" stroke="#44332a" stroke-width="1.5"/>

    <!-- Chat Header -->
    <rect x="0" y="0" width="336" height="48" rx="12" fill="#251d18"/>
    <text x="20" y="30" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Community Stream Chat</text>
    <circle cx="305" cy="24" r="4" fill="#10b981"/>

    <!-- Chat Messages -->
    <!-- Chat item 1 -->
    <g transform="translate(16, 64)">
      <circle cx="16" cy="16" r="14" fill="#78350f"/>
      <text x="16" y="21" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="bold">AR</text>
      <text x="40" y="14" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="600">Alex R.</text>
      <text x="40" y="30" fill="#e7e5e4" font-family="sans-serif" font-size="12">That roast color looks incredible!</text>
    </g>

    <!-- Chat item 2 -->
    <g transform="translate(16, 120)">
      <circle cx="16" cy="16" r="14" fill="#0284c7"/>
      <text x="16" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">SL</text>
      <text x="40" y="14" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Sarah L.</text>
      <text x="40" y="30" fill="#e7e5e4" font-family="sans-serif" font-size="12">Just pre-ordered 2 bags of the Yirgacheffe ☕</text>
    </g>

    <!-- Chat item 3 (Action event) -->
    <g transform="translate(16, 176)">
      <rect width="304" height="42" rx="8" fill="#3b291d" stroke="#78350f" stroke-width="1"/>
      <text x="12" y="25" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="600">🎉 Marcus unlocked "Batch Sponsor" badge!</text>
    </g>

    <!-- Chat item 4 -->
    <g transform="translate(16, 236)">
      <circle cx="16" cy="16" r="14" fill="#059669"/>
      <text x="16" y="21" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">MK</text>
      <text x="40" y="14" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">Mihir (Creator)</text>
      <text x="40" y="30" fill="#e7e5e4" font-family="sans-serif" font-size="12">Cooling tray dump happening in 2 mins!</text>
    </g>

    <!-- Chat Input Box Mockup -->
    <g transform="translate(16, 380)">
      <rect width="304" height="42" rx="21" fill="#2d221c" stroke="#574136" stroke-width="1"/>
      <text x="20" y="26" fill="#a8a29e" font-family="sans-serif" font-size="13">Send a message to the stream...</text>
      <circle cx="282" cy="21" r="14" fill="#d97706"/>
      <path d="M278 21l6-4v8z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Bottom Metric Cards -->
  <g transform="translate(40, 548)">
    <rect width="240" height="116" rx="10" fill="#1c1613" stroke="#382b23" stroke-width="1"/>
    <text x="20" y="32" fill="#a8a29e" font-family="sans-serif" font-size="12" font-weight="600">RETENTION RATE</text>
    <text x="20" y="74" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="700">+64%</text>
    <text x="20" y="98" fill="#10b981" font-family="sans-serif" font-size="12">▲ vs standard e-commerce</text>
  </g>

  <g transform="translate(300, 548)">
    <rect width="240" height="116" rx="10" fill="#1c1613" stroke="#382b23" stroke-width="1"/>
    <text x="20" y="32" fill="#a8a29e" font-family="sans-serif" font-size="12" font-weight="600">BATCH PRE-ORDERS</text>
    <text x="20" y="74" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="700">100%</text>
    <text x="20" y="98" fill="#f59e0b" font-family="sans-serif" font-size="12">Sold out before cooldown</text>
  </g>

  <g transform="translate(560, 548)">
    <rect width="240" height="116" rx="10" fill="#1c1613" stroke="#382b23" stroke-width="1"/>
    <text x="20" y="32" fill="#a8a29e" font-family="sans-serif" font-size="12" font-weight="600">AVG WATCH TIME</text>
    <text x="20" y="74" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="700">18.4m</text>
    <text x="20" y="98" fill="#38bdf8" font-family="sans-serif" font-size="12">High engagement loop</text>
  </g>

  <g transform="translate(824, 548)">
    <rect width="336" height="116" rx="10" fill="url(#accentGrad)"/>
    <text x="24" y="36" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Interactive E-Commerce Prototype</text>
    <text x="24" y="62" fill="#fef3c7" font-family="sans-serif" font-size="13">Designed &amp; built by Mihir • Full Case Study</text>
    <rect x="24" y="78" width="120" height="26" rx="13" fill="#1c1613" opacity="0.4"/>
    <text x="42" y="95" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Design + Code</text>
  </g>
</svg>
