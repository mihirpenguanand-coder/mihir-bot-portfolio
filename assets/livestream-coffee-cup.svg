<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a201a"/>
      <stop offset="50%" stop-color="#191310"/>
      <stop offset="100%" stop-color="#0e0a08"/>
    </radialGradient>

    <!-- Cup Paper Gradient (Warm Matte Charcoal & Espresso) -->
    <linearGradient id="cupBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1613"/>
      <stop offset="25%" stop-color="#2c221d"/>
      <stop offset="70%" stop-color="#3b2e27"/>
      <stop offset="100%" stop-color="#1f1814"/>
    </linearGradient>

    <!-- Cup Lid Gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#110d0b"/>
      <stop offset="50%" stop-color="#251d18"/>
      <stop offset="100%" stop-color="#0f0c0a"/>
    </linearGradient>

    <!-- Sleeve Gradient -->
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a5a22"/>
      <stop offset="35%" stop-color="#c97a32"/>
      <stop offset="70%" stop-color="#d9822b"/>
      <stop offset="100%" stop-color="#8a4b18"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="cupShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="30" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.85"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="900" rx="20" fill="url(#bgGlow)"/>

  <!-- Top Badge / Header Bar -->
  <g transform="translate(60, 45)">
    <rect width="880" height="60" rx="12" fill="#17120f" stroke="#36261d" stroke-width="1.5"/>
    <circle cx="36" cy="30" r="14" fill="#d97706"/>
    <!-- Coffee icon -->
    <path d="M30 25h12v7a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4v-7zm12 2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2v-4z" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <text x="64" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">LIVESTREAM COFFEE • SURAT</text>
    <text x="690" y="36" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PACKAGING COPY CONCEPT</text>
  </g>

  <!-- Main Showcase Area: Takeaway Cup with The Copy -->
  <g transform="translate(180, 140)" filter="url(#cupShadow)">
    
    <!-- Cast Shadow under cup base -->
    <ellipse cx="320" cy="650" rx="160" ry="24" fill="#000000" opacity="0.7" filter="blur(10px)"/>

    <!-- Cup Lid Base & Spout -->
    <!-- Top rim lid -->
    <path d="M220 70 L420 70 L400 95 L240 95 Z" fill="url(#lidGrad)"/>
    <rect x="230" y="55" width="180" height="18" rx="6" fill="#2d231e"/>
    <rect x="295" y="48" width="50" height="10" rx="3" fill="#17120f"/>
    <!-- Lid Lip -->
    <rect x="180" y="92" width="280" height="26" rx="8" fill="url(#lidGrad)" stroke="#443228" stroke-width="1"/>

    <!-- Cup Main Body (Back Side Facing Us) -->
    <path d="M195 116 L445 116 L405 610 L235 610 Z" fill="url(#cupBodyGrad)" stroke="#382920" stroke-width="1.5"/>

    <!-- Cup Subtle Vertical Highlights / Matte texture -->
    <path d="M235 118 L248 118 L272 608 L258 608 Z" fill="#ffffff" opacity="0.04"/>
    <path d="M370 118 L405 118 L375 608 L348 608 Z" fill="#ffffff" opacity="0.06"/>

    <!-- Cup Kraft Cardboard Sleeve -->
    <path d="M208 240 L432 240 L418 435 L222 435 Z" fill="url(#sleeveGrad)" stroke="#5e3312" stroke-width="1.5"/>
    
    <!-- Sleeve Texture Stripes -->
    <path d="M210 244 L430 244 M212 254 L428 254 M214 264 L426 264 M216 415 L424 415 M218 425 L422 425" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- Logo on Sleeve -->
    <g transform="translate(320, 335)">
      <circle cx="0" cy="0" r="42" fill="#1c1613" stroke="#f59e0b" stroke-width="2"/>
      <!-- Stream Coffee Icon -->
      <path d="M-12 -8h24v12a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8v-12zm24 3h4a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-4v-6z" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <path d="M-6 -18 C-4 -14 -8 -12 -6 -8 M0 -18 C2 -14 -2 -12 0 -8 M6 -18 C8 -14 4 -12 6 -8" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="0" y="24" text-anchor="middle" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1">LIVESTREAM</text>
    </g>

    <!-- BACK OF CUP COPY PRINT (The Star of the Show!) -->
    <!-- Card box highlighting the back-of-cup copy -->
    <g transform="translate(195, 460)">
      <rect x="25" y="0" width="200" height="120" rx="8" fill="#17120f" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>
      
      <text x="125" y="24" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">PRINTED ON BACK</text>

      <!-- The exact punchy copy -->
      <text x="125" y="48" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">"Surat has 200+ cafes.</text>
      <text x="125" y="68" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">But you’re holding this cup.</text>
      
      <text x="125" y="96" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" font-weight="600">Taste really isn’t subjective, is it?"</text>
    </g>
  </g>

  <!-- Side Floating Callout Card: Why it works -->
  <g transform="translate(620, 240)" filter="url(#cardShadow)">
    <rect width="320" height="360" rx="14" fill="#1c1613" stroke="#44332a" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="320" height="48" rx="14" fill="#291d17"/>
    <text x="20" y="30" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">💡 STRATEGY &amp; HOOK</text>

    <!-- Points -->
    <g transform="translate(20, 70)">
      <circle cx="8" cy="8" r="6" fill="#f59e0b"/>
      <text x="24" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Hyper-Local Relevance</text>
      <text x="24" y="32" fill="#a8a29e" font-family="sans-serif" font-size="12" width="260">Calls out the 200+ Surat cafes directly to spark local chatter.</text>
    </g>

    <g transform="translate(20, 140)">
      <circle cx="8" cy="8" r="6" fill="#f59e0b"/>
      <text x="24" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Flattery Over Boasting</text>
      <text x="24" y="32" fill="#a8a29e" font-family="sans-serif" font-size="12">Makes the customer feel superior for choosing Livestream.</text>
    </g>

    <g transform="translate(20, 210)">
      <circle cx="8" cy="8" r="6" fill="#f59e0b"/>
      <text x="24" y="12" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Instagram-Ready</text>
      <text x="24" y="32" fill="#a8a29e" font-family="sans-serif" font-size="12">Gives drinkers an effortless reason to snap &amp; post their cup on Stories.</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="290" width="280" height="44" rx="8" fill="#261b14" stroke="#52392b" stroke-width="1"/>
    <text x="160" y="317" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600">✨ 1 Direct-to-Consumer Copy Option</text>
  </g>
</svg>
